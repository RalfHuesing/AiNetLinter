<svg width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wie drift-loop arbeitet, mit Roadmap und großer Schleife</title>
<desc>Bildergeschichte: Aus dem Konzept-Dokument erstellt der Roboter Plant zuerst eine Roadmap (grobe Checkliste). Dann läuft eine Schleife: Plant plant einen Schritt, Baut setzt ihn um, Prüft kontrolliert. Prüft schickt das Ergebnis immer wieder zurück an Plant – das kann oft passieren, bis nichts mehr offen ist. Erst dann verzweigt Plant zu Fertig, übrig bleibt eine kleine Liste offener Punkte für später.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.th { font-size:14px; font-weight:600; }
.ts { font-size:12px; font-weight:400; }
.arr { stroke:#73726C; stroke-width:1.5; fill:none; }
.leader { stroke:#9C9A92; stroke-width:1; stroke-dasharray:3 3; fill:none; }
.c-amber rect { fill:#FAEEDA; stroke:#854F0B; }
.c-amber .th { fill:#633806; }
.c-amber .ts { fill:#854F0B; }
.c-blue rect { fill:#E6F1FB; stroke:#185FA5; }
.c-blue .th { fill:#0C447C; }
.c-blue .ts { fill:#185FA5; }
.c-purple rect, .c-purple circle, .c-purple ellipse { fill:#EEEDFE; stroke:#534AB7; }
.c-purple .th { fill:#3C3489; }
.c-teal rect, .c-teal circle, .c-teal ellipse { fill:#E1F5EE; stroke:#0F6E56; }
.c-teal .th { fill:#085041; }
.c-coral rect, .c-coral circle, .c-coral ellipse { fill:#FAECE7; stroke:#993C1D; }
.c-coral .th { fill:#712B13; }
.c-green rect { fill:#EAF3DE; stroke:#3B6D11; }
.c-green .th { fill:#27500A; }
.c-green .ts { fill:#3B6D11; }
.c-gray rect { fill:#F1EFE8; stroke:#5F5E5A; }
.c-gray .th { fill:#444441; }
.c-gray .ts { fill:#5F5E5A; }
</style>

<rect x="0" y="0" width="680" height="630" fill="#FFFFFF"/>

<!-- Roadmap -->
<g class="c-blue">
<rect x="270" y="30" width="140" height="100" rx="12" stroke-width="1"/>
</g>
<rect x="286" y="62" width="9" height="9" rx="2" fill="#2C2C2A"/>
<rect x="300" y="64" width="55" height="3" rx="1.5" fill="#2C2C2A" opacity="0.5"/>
<rect x="286" y="78" width="9" height="9" rx="2" fill="none" stroke="#2C2C2A" stroke-width="1"/>
<rect x="300" y="80" width="68" height="3" rx="1.5" fill="#2C2C2A" opacity="0.5"/>
<rect x="286" y="94" width="9" height="9" rx="2" fill="#2C2C2A"/>
<rect x="300" y="96" width="45" height="3" rx="1.5" fill="#2C2C2A" opacity="0.5"/>
<text class="th c-blue" x="340" y="52" text-anchor="middle">Roadmap</text>
<text class="ts c-blue" x="340" y="120" text-anchor="middle">grobe Punkte</text>

<!-- Konzept -->
<g class="c-amber">
<rect x="50" y="330" width="130" height="120" rx="14" stroke-width="1"/>
</g>
<line x1="50" y1="340" x2="40" y2="332" stroke-width="2" stroke-linecap="round" stroke="#BA7517" opacity="0.7"/>
<line x1="180" y1="340" x2="190" y2="332" stroke-width="2" stroke-linecap="round" stroke="#BA7517" opacity="0.7"/>
<line x1="50" y1="440" x2="40" y2="448" stroke-width="2" stroke-linecap="round" stroke="#BA7517" opacity="0.7"/>
<line x1="180" y1="440" x2="190" y2="448" stroke-width="2" stroke-linecap="round" stroke="#BA7517" opacity="0.7"/>
<rect x="70" y="343" width="60" height="4" rx="2" fill="#2C2C2A" opacity="0.18"/>
<rect x="70" y="353" width="90" height="4" rx="2" fill="#2C2C2A" opacity="0.18"/>
<rect x="70" y="363" width="45" height="4" rx="2" fill="#2C2C2A" opacity="0.18"/>
<text class="th c-amber" x="115" y="395" text-anchor="middle">Konzept</text>
<text class="ts c-amber" x="115" y="413" text-anchor="middle">das Ziel</text>

<!-- Pfeil Konzept -> Plant -->
<path d="M184,355 Q250,290 310,265" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="208" y="312" fill="#5F5E5A">los geht's</text>

<!-- Pfeil Plant -> Roadmap -->
<path d="M330,204 Q332,165 335,134" fill="none" stroke-width="1.5" stroke="#5F5E5A" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="345" y="172" fill="#5F5E5A">erstellt &amp; prüft</text>

<!-- große Rückschleife Prüft -> Plant, mit Echo für "passiert oft" -->
<path d="M292,506 Q212,409 292,312" fill="none" stroke-width="1.5" stroke="#5F5E5A" stroke-dasharray="4 4" opacity="0.35"/>
<path d="M305,518 Q225,409 305,300" fill="none" stroke-width="2" stroke="#5F5E5A" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text class="ts" fill="#5F5E5A"><tspan x="196" y="336">kann sich</tspan><tspan x="196" dy="14">oft wiederholen</tspan></text>

<!-- Plant (freundlicher Roboter) -->
<g class="c-purple">
<line x1="330" y1="222" x2="330" y2="214" stroke-width="2.5" stroke-linecap="round" stroke="#2C2C2A"/>
<circle cx="330" cy="212" r="4.5" stroke-width="1"/>
<circle cx="330" cy="248" r="18" stroke-width="1"/>
<circle cx="324" cy="246" r="3" fill="#2C2C2A"/>
<circle cx="336" cy="246" r="3" fill="#2C2C2A"/>
<path d="M322,256 Q330,262 338,256" fill="none" stroke-width="2" stroke-linecap="round" stroke="#2C2C2A"/>
<rect x="309" y="268" width="42" height="48" rx="16" stroke-width="1"/>
<rect x="298" y="276" width="11" height="24" rx="5" stroke-width="1" transform="rotate(-14 303 276)"/>
<rect x="351" y="276" width="11" height="24" rx="5" stroke-width="1" transform="rotate(14 357 276)"/>
<ellipse cx="320" cy="318" rx="7" ry="5" stroke-width="1"/>
<ellipse cx="340" cy="318" rx="7" ry="5" stroke-width="1"/>
<rect x="353" y="285" width="17" height="21" rx="2" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<line x1="357" y1="292" x2="366" y2="292" stroke-width="1" stroke="#2C2C2A"/>
<line x1="357" y1="298" x2="366" y2="298" stroke-width="1" stroke="#2C2C2A"/>
<text class="th" x="330" y="343" text-anchor="middle" fill="#3C3489">Plant</text>
</g>

<!-- Pfeil Plant -> Baut -->
<path d="M358,288 Q415,305 446,336" fill="none" class="arr" marker-end="url(#arrow)"/>

<!-- Pfeil Plant -> Fertig (wenn Roadmap leer) -->
<path d="M358,255 Q430,238 503,268" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="392" y="238" fill="#5F5E5A">Roadmap leer?</text>

<!-- Baut (freundlicher Roboter) -->
<g class="c-teal">
<line x1="460" y1="342" x2="460" y2="334" stroke-width="2.5" stroke-linecap="round" stroke="#2C2C2A"/>
<circle cx="460" cy="332" r="4.5" stroke-width="1"/>
<circle cx="460" cy="368" r="18" stroke-width="1"/>
<circle cx="454" cy="366" r="3" fill="#2C2C2A"/>
<circle cx="466" cy="366" r="3" fill="#2C2C2A"/>
<path d="M452,376 Q460,382 468,376" fill="none" stroke-width="2" stroke-linecap="round" stroke="#2C2C2A"/>
<rect x="439" y="388" width="42" height="48" rx="16" stroke-width="1"/>
<rect x="428" y="396" width="11" height="24" rx="5" stroke-width="1" transform="rotate(-14 433 396)"/>
<rect x="481" y="396" width="11" height="24" rx="5" stroke-width="1" transform="rotate(14 487 396)"/>
<ellipse cx="450" cy="438" rx="7" ry="5" stroke-width="1"/>
<ellipse cx="470" cy="438" rx="7" ry="5" stroke-width="1"/>
<rect x="473" y="410" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<rect x="481" y="402" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1"/>
<text class="th" x="460" y="463" text-anchor="middle" fill="#085041">Baut</text>
</g>

<!-- Pfeil Baut -> Prüft -->
<path d="M448,440 Q425,465 366,478" fill="none" class="arr" marker-end="url(#arrow)"/>

<!-- Prüft (freundlicher Roboter) -->
<g class="c-coral">
<line x1="330" y1="462" x2="330" y2="454" stroke-width="2.5" stroke-linecap="round" stroke="#2C2C2A"/>
<circle cx="330" cy="452" r="4.5" stroke-width="1"/>
<circle cx="330" cy="488" r="18" stroke-width="1"/>
<circle cx="324" cy="486" r="3" fill="#2C2C2A"/>
<circle cx="336" cy="486" r="3" fill="#2C2C2A"/>
<path d="M322,496 Q330,502 338,496" fill="none" stroke-width="2" stroke-linecap="round" stroke="#2C2C2A"/>
<rect x="309" y="508" width="42" height="48" rx="16" stroke-width="1"/>
<rect x="298" y="516" width="11" height="24" rx="5" stroke-width="1" transform="rotate(-14 303 516)"/>
<rect x="351" y="516" width="11" height="24" rx="5" stroke-width="1" transform="rotate(14 357 516)"/>
<ellipse cx="320" cy="558" rx="7" ry="5" stroke-width="1"/>
<ellipse cx="340" cy="558" rx="7" ry="5" stroke-width="1"/>
<circle cx="354" cy="530" r="7" fill="none" stroke="#2C2C2A" stroke-width="2"/>
<line x1="359" y1="535" x2="368" y2="544" stroke-width="2" stroke-linecap="round" stroke="#2C2C2A"/>
<text class="th" x="330" y="583" text-anchor="middle" fill="#712B13">Prüft</text>
</g>

<!-- Fertig -->
<g class="c-green">
<rect x="505" y="248" width="125" height="72" rx="14" stroke-width="1"/>
</g>
<text class="th c-green" x="567" y="278" text-anchor="middle">Fertig!</text>
<text class="ts c-green" x="567" y="298" text-anchor="middle">wie gewünscht</text>

<!-- Leader zu Tech-Debt -->
<line x1="567" y1="320" x2="567" y2="344" class="leader"/>

<!-- Tech-Debt -->
<g class="c-gray">
<rect x="505" y="344" width="125" height="64" rx="12" stroke-width="1"/>
</g>
<text class="th c-gray" x="567" y="370" text-anchor="middle">Für später</text>
<text class="ts c-gray" x="567" y="388" text-anchor="middle">was noch fehlt</text>
</svg>
